<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>TLS-Check</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-title-key="login.title">
{{HEADER}}
<div class="login-wrap">
  <div class="card login fade" id="card">
    <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="lg2" x1="6" y1="3" x2="34" y2="37" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6366f1"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
      <path d="M20 3.5 L33.5 8.6 v9.6 c0 8.2-5.8 14.6-13.5 17.4 C12.3 32.8 6.5 26.4 6.5 18.2 V8.6 Z" fill="url(#lg2)"/>
      <rect x="14.5" y="17.5" width="11" height="8.5" rx="1.8" fill="#fff"/>
      <path d="M16.8 17.5v-2.3a3.2 3.2 0 0 1 6.4 0v2.3" stroke="#fff" stroke-width="2.2" fill="none"/>
    </svg>
    <h2 data-i18n="login.title">Anmelden</h2>
    <p data-i18n="login.lead"></p>
    <form method="post" action="/login" id="f" autocomplete="on">
      <div id="msg" class="msg hide"></div>
      <input type="text" name="username" value="tlscheck" autocomplete="username" class="hide" tabindex="-1" aria-hidden="true">
      <div class="inbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16.5 6.5l3 3M14 9l2 2"/></svg>
        <input type="password" name="password" id="pw" required autofocus autocomplete="current-password" data-i18n-ph="login.pw">
      </div>
      <button class="btn" type="submit" id="go"><span data-i18n="login.btn">Anmelden</span></button>
    </form>
    <div class="fine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="11" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <span data-i18n="login.fine"></span>
    </div>
  </div>
</div>
<script src="/assets/common.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
